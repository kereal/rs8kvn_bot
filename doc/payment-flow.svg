<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1540" viewBox="0 0 1800 1540" role="img" aria-labelledby="title desc">
  <title id="title">Payment Flow и Chargeback</title>
  <desc id="desc">Графическая схема создания платежа, обработки callback, подтверждения, delayed webhook grace period и chargeback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="purchase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123b61"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
    <linearGradient id="callback" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b236d"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="chargeback" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#65253a"/>
      <stop offset="1" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="success" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14532d"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="warning" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#713f12"/>
      <stop offset="1" stop-color="#a16207"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#fb7185"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #cbd5e1; }
      .lane-title { font: 700 19px Arial, sans-serif; fill: #e2e8f0; letter-spacing: 1px; }
      .box-title { font: 700 18px Arial, sans-serif; fill: #f8fafc; }
      .box-text { font: 400 15px Arial, sans-serif; fill: #dbeafe; }
      .small { font: 400 14px Arial, sans-serif; fill: #cbd5e1; }
      .tiny { font: 400 13px Arial, sans-serif; fill: #cbd5e1; }
      .edge { fill: none; stroke: #94a3b8; stroke-width: 3; marker-end: url(#arrow); }
      .edge-green { fill: none; stroke: #34d399; stroke-width: 3; marker-end: url(#arrow-green); }
      .edge-red { fill: none; stroke: #fb7185; stroke-width: 3; marker-end: url(#arrow-red); }
      .edge-label { font: 700 13px Arial, sans-serif; fill: #cbd5e1; }
      .badge { font: 700 13px Arial, sans-serif; fill: #fff; }
    </style>
  </defs>

  <rect width="1800" height="1540" fill="url(#bg)"/>
  <text x="70" y="64" class="title">Payment Flow &amp; Chargeback</text>
  <text x="70" y="96" class="subtitle">Platega · pending intent · delayed webhook grace period · atomic subscription sync</text>

  <!-- Lanes -->
  <rect x="45" y="130" width="1710" height="370" rx="20" fill="#0f2740" stroke="#1e6091" stroke-width="2"/>
  <rect x="45" y="525" width="1710" height="475" rx="20" fill="#251443" stroke="#6d28d9" stroke-width="2"/>
  <rect x="45" y="1025" width="1710" height="445" rx="20" fill="#351624" stroke="#9f1239" stroke-width="2"/>

  <text x="75" y="168" class="lane-title">① СОЗДАНИЕ ПЛАТЕЖА</text>
  <text x="75" y="563" class="lane-title">② CALLBACK / CONFIRMED</text>
  <text x="75" y="1063" class="lane-title">③ CANCELED / CHARGEBACKED</text>

  <!-- Purchase flow -->
  <g filter="url(#shadow)">
    <rect x="80" y="205" width="235" height="115" rx="14" fill="url(#purchase)"/>
    <text x="100" y="240" class="box-title">Telegram</text>
    <text x="100" y="267" class="box-text">Пользователь нажимает</text>
    <text x="100" y="289" class="box-text">«Оплатить»</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="380" y="205" width="250" height="115" rx="14" fill="url(#purchase)"/>
    <text x="400" y="240" class="box-title">OrderService</text>
    <text x="400" y="267" class="box-text">canonical Product</text>
    <text x="400" y="289" class="box-text">+ активная подписка</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="695" y="205" width="270" height="115" rx="14" fill="url(#purchase)"/>
    <text x="715" y="240" class="box-title">Pending intent</text>
    <text x="715" y="267" class="box-text">Один intent на</text>
    <text x="715" y="289" class="box-text">subscription + product</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1030" y="205" width="250" height="115" rx="14" fill="url(#purchase)"/>
    <text x="1050" y="240" class="box-title">Platega</text>
    <text x="1050" y="267" class="box-text">Создание транзакции</text>
    <text x="1050" y="289" class="box-text">и payment URL</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1345" y="205" width="350" height="115" rx="14" fill="url(#success)"/>
    <text x="1365" y="240" class="box-title">Order saved</text>
    <text x="1365" y="267" class="box-text">provider ID + URL</text>
    <text x="1365" y="289" class="box-text">PaymentExpiresAt = expiresIn</text>
  </g>

  <path d="M315 262 L380 262" class="edge"/>
  <path d="M630 262 L695 262" class="edge"/>
  <path d="M965 262 L1030 262" class="edge"/>
  <path d="M1280 262 L1345 262" class="edge-green"/>
  <text x="690" y="356" class="small">Существующая действующая ссылка переиспользуется</text>
  <path d="M830 320 C830 385 820 385 740 385 L740 320" class="edge"/>

  <rect x="120" y="382" width="430" height="78" rx="12" fill="#0b1f33" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="145" y="414" class="box-text">Перед запросом к провайдеру:</text>
  <text x="145" y="438" class="box-text">payment_creation_uncertain = true</text>
  <rect x="580" y="382" width="430" height="78" rx="12" fill="#0b1f33" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="605" y="414" class="box-text">Timeout / неизвестная ошибка:</text>
  <text x="605" y="438" class="box-text">авторучная сверка, без опасного retry</text>
  <rect x="1040" y="382" width="620" height="78" rx="12" fill="#0b1f33" stroke="#34d399" stroke-width="1.5"/>
  <text x="1065" y="414" class="box-text">Важно: grace period НЕ продлевает payment URL</text>
  <text x="1065" y="438" class="box-text">и не влияет на повторную выдачу ссылки.</text>

  <!-- Callback flow -->
  <g filter="url(#shadow)">
    <rect x="80" y="600" width="260" height="120" rx="14" fill="url(#callback)"/>
    <text x="100" y="636" class="box-title">Webhook Platega</text>
    <text x="100" y="664" class="box-text">POST /payment/callback</text>
    <text x="100" y="688" class="box-text">headers + JSON</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="420" y="600" width="270" height="120" rx="14" fill="url(#callback)"/>
    <text x="440" y="636" class="box-title">Validation</text>
    <text x="440" y="664" class="box-text">UUID, подпись, сумма</text>
    <text x="440" y="688" class="box-text">и валюта</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="770" y="600" width="270" height="120" rx="14" fill="url(#callback)"/>
    <text x="790" y="636" class="box-title">Order lookup</text>
    <text x="790" y="664" class="box-text">provider_payment_id</text>
    <text x="790" y="688" class="box-text">+ payment lock</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1120" y="600" width="260" height="120" rx="14" fill="#312e81"/>
    <text x="1140" y="636" class="box-title">CONFIRMED?</text>
    <text x="1140" y="664" class="box-text">Проверка статуса</text>
    <text x="1140" y="688" class="box-text">заказа</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1460" y="600" width="230" height="120" rx="14" fill="url(#success)"/>
    <text x="1480" y="636" class="box-title">Already paid</text>
    <text x="1480" y="664" class="box-text">Idempotent no-op</text>
    <text x="1480" y="688" class="box-text">HTTP 200</text>
  </g>
  <path d="M340 660 L420 660" class="edge"/>
  <path d="M690 660 L770 660" class="edge"/>
  <path d="M1040 660 L1120 660" class="edge"/>
  <path d="M1380 660 L1460 660" class="edge-green"/>

  <g filter="url(#shadow)">
    <rect x="155" y="805" width="375" height="120" rx="14" fill="url(#success)"/>
    <text x="180" y="842" class="box-title">pending → paid</text>
    <text x="180" y="870" class="box-text">ConfirmOrderPaidCAS</text>
    <text x="180" y="894" class="box-text">DB transaction + plan setup</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="620" y="805" width="390" height="120" rx="14" fill="url(#success)"/>
    <text x="645" y="842" class="box-title">expired → paid</text>
    <text x="645" y="870" class="box-text">только в течение 5 минут</text>
    <text x="645" y="894" class="box-text">после PaymentExpiresAt</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1100" y="805" width="500" height="120" rx="14" fill="url(#success)"/>
    <text x="1125" y="842" class="box-title">После commit</text>
    <text x="1125" y="870" class="box-text">VPN sync best-effort + уведомления</text>
    <text x="1125" y="894" class="box-text">ошибка sync → retry worker</text>
  </g>
  <path d="M1250 720 L820 805" class="edge-green"/>
  <path d="M1250 720 L350 805" class="edge-green"/>
  <text x="910" y="765" class="edge-label">pending / expired</text>
  <path d="M530 865 L620 865" class="edge-green"/>
  <path d="M1010 865 L1100 865" class="edge-green"/>
  <path d="M1380 720 C1380 750 1430 760 1430 805" class="edge-red"/>
  <text x="1438" y="765" class="edge-label">expired &gt; grace</text>

  <rect x="150" y="946" width="1450" height="30" rx="15" fill="#42206a"/>
  <text x="875" y="967" text-anchor="middle" class="badge">Grace period касается только delayed webhook — не срока жизни payment URL</text>

  <!-- Chargeback flow -->
  <g filter="url(#shadow)">
    <rect x="80" y="1100" width="290" height="120" rx="14" fill="url(#chargeback)"/>
    <text x="100" y="1136" class="box-title">CANCELED</text>
    <text x="100" y="1164" class="box-text">pending → canceled</text>
    <text x="100" y="1188" class="box-text">paid order не трогаем</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="460" y="1100" width="290" height="120" rx="14" fill="url(#chargeback)"/>
    <text x="480" y="1136" class="box-title">CHARGEBACKED</text>
    <text x="480" y="1164" class="box-text">Atomic chargeback CAS</text>
    <text x="480" y="1188" class="box-text">paid → canceled</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="840" y="1100" width="300" height="120" rx="14" fill="#7c2d12"/>
    <text x="860" y="1136" class="box-title">Другой paid order?</text>
    <text x="860" y="1164" class="box-text">Проверка coverage</text>
    <text x="860" y="1188" class="box-text">по той же подписке</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1230" y="1055" width="410" height="120" rx="14" fill="#713f12"/>
    <text x="1250" y="1091" class="box-title">Да</text>
    <text x="1250" y="1119" class="box-text">Доступ сохраняется</text>
    <text x="1250" y="1143" class="box-text">Admin alert: другой paid order</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1230" y="1230" width="410" height="120" rx="14" fill="url(#success)"/>
    <text x="1250" y="1266" class="box-title">Нет</text>
    <text x="1250" y="1294" class="box-text">Premium → free plan</text>
    <text x="1250" y="1318" class="box-text">pending node removal/add</text>
  </g>
  <path d="M370 1160 L460 1160" class="edge-red"/>
  <path d="M750 1160 L840 1160" class="edge-red"/>
  <path d="M1140 1160 C1180 1160 1180 1115 1230 1115" class="edge"/>
  <path d="M1140 1160 C1180 1160 1180 1290 1230 1290" class="edge-green"/>
  <text x="1165" y="1092" class="edge-label">есть</text>
  <text x="1165" y="1280" class="edge-label">нет</text>
  <text x="840" y="1405" class="small">После downgrade: VPN sync best-effort, ошибки повторяются фоновым worker-ом</text>

  <!-- Legend -->
  <rect x="80" y="1490" width="1640" height="25" rx="12" fill="#1e293b"/>
  <circle cx="110" cy="1502" r="7" fill="#34d399"/>
  <text x="128" y="1507" class="tiny">успешный/транзакционный путь</text>
  <circle cx="390" cy="1502" r="7" fill="#fb7185"/>
  <text x="408" y="1507" class="tiny">отмена/ручная обработка</text>
  <circle cx="660" cy="1502" r="7" fill="#38bdf8"/>
  <text x="678" y="1507" class="tiny">provider/payment intent</text>
  <text x="1690" y="1507" text-anchor="end" class="tiny">rs8kvn_bot</text>
</svg>
